<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PYROS — Audit terrain</title>
<meta name="theme-color" content="#161826">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PYROS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161826; --panel:#1c1f30; --card:#20233a; --card-2:#252843;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --ink:#e9e9ed; --muted:#9a9ab6; --faint:#6d6e88;
    --accent:#9184d9; --accent-soft:rgba(145,132,217,.16);
    --red:#f87171; --red-soft:rgba(220,38,38,.13); --green:#4ade80;
    --ok:#6bd0a0; --warn:#e8a33d; --warn-soft:rgba(232,163,61,.14);
    --r:14px; --font:"Inter",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--font)}
  body{max-width:860px;margin:0 auto;padding:0 16px 96px;line-height:1.5}
  .kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .muted{color:var(--muted)} .faint{color:var(--faint)}

  /* header */
  header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 78%,rgba(22,24,38,0));padding:18px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
  .meta{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}
  .meta input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:9px 11px;font:inherit;font-size:13px}
  .meta input::placeholder{color:var(--faint)}
  .meta input:focus{outline:none;border-color:var(--accent)}
  .prog{margin-top:12px;display:flex;align-items:center;gap:10px}
  .bar{flex:1;height:6px;border-radius:999px;background:var(--card);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .3s ease}
  .prog b{font-size:12px;color:var(--muted);font-weight:600;min-width:74px;text-align:right;font-variant-numeric:tabular-nums}

  /* home grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}}
  .zcard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:15px 15px 13px;cursor:pointer;transition:border-color .15s,transform .05s;display:flex;flex-direction:column;gap:9px;font:inherit;color:inherit}
  .zcard:hover{border-color:var(--line-2)} .zcard:active{transform:scale(.99)}
  .zcard .ic{font-size:22px;line-height:1}
  .zcard .nm{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
  .zcard .st{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
  .zcard .frac{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .zcard .mini{height:4px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
  .zcard .mini>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .flagpill{font-size:11px;font-weight:600;color:#f77;background:rgba(220,38,38,.15);
    border:1px solid rgba(220,38,38,.32);padding:2px 8px;border-radius:999px;white-space:nowrap}
  .zcard.special{background:linear-gradient(180deg,var(--card-2),var(--card));border-style:dashed;border-color:var(--line-2)}

  /* zone view */
  .topline{display:flex;align-items:center;gap:12px;margin:16px 0 4px}
  .back{background:var(--card);border:1px solid var(--line);color:var(--ink);width:38px;height:38px;
    border-radius:10px;font-size:18px;cursor:pointer;flex:none;display:grid;place-items:center}
  .back:hover{border-color:var(--line-2)}
  .topline h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
  .zsub{font-size:12px;color:var(--muted);margin:2px 0 10px 50px}

  .item{background:var(--card);border:1px solid var(--line);border-left:3px solid transparent;
    border-radius:12px;padding:12px 13px;margin-bottom:9px;transition:border-color .15s,background .15s}
  .item.ok{border-left-color:#16a34a;background:linear-gradient(90deg,rgba(22,163,74,.10),var(--card) 62%)}
  .item.issue{border-left-color:#dc2626;background:linear-gradient(90deg,rgba(220,38,38,.10),var(--card) 62%)}
  .lbl{font-size:14px}
  .statgrp{display:flex;gap:8px;margin-top:10px}
  .sbtn{flex:1;border:1px solid var(--line-2);background:transparent;color:var(--muted);border-radius:9px;
    padding:9px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.14s;display:flex;align-items:center;justify-content:center;gap:6px}
  .sbtn .d{font-size:15px;line-height:1}
  .sbtn.ok:hover{border-color:#16a34a;color:#4ade80}
  .sbtn.ko:hover{border-color:#dc2626;color:#f87171}
  .sbtn.ok[aria-pressed="true"]{background:#16a34a;border-color:#16a34a;color:#fff}
  .sbtn.ko[aria-pressed="true"]{background:#dc2626;border-color:#dc2626;color:#fff}
  .note{width:100%;margin-top:9px;background:rgba(0,0,0,.16);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:9px 10px;font:inherit;font-size:13px;resize:none;min-height:38px;overflow:hidden;line-height:1.45}
  .note::placeholder{color:var(--faint)}
  .note:focus{outline:none;border-color:var(--accent)}

  /* synthesis + export */
  .panelbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px}
  .bkgroup{margin-bottom:16px}
  .bkgroup h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-weight:600}
  .bkitem{border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:9px 11px;margin-bottom:7px;font-size:13.5px}
  .bkitem .bn{color:var(--muted);font-size:12.5px;margin-top:3px;white-space:pre-wrap}
  .empty{color:var(--faint);font-size:14px;text-align:center;padding:36px 10px}
  .actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}
  .btn{background:var(--accent);color:#12131f;border:none;border-radius:10px;padding:11px 15px;font:inherit;
    font-weight:600;font-size:13.5px;cursor:pointer;transition:.12s}
  .btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
  .btn.danger{background:transparent;color:#e0776e;border:1px solid rgba(224,119,110,.35)}
  .sumrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .sumrow:last-child{border-bottom:none}
  .sumrow .r{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .prevwrap{margin-top:14px}
  .prevwrap .plabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
  iframe#preview{width:100%;height:540px;border:1px solid var(--line);border-radius:12px;background:#fff;display:block}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--accent);
    color:#12131f;font-weight:600;font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{text-align:center;color:var(--faint);font-size:11px;margin-top:22px}

  /* section switcher */
  .seg{display:flex;gap:7px;margin-top:12px;background:var(--card);padding:5px;border-radius:12px;border:1px solid var(--line)}
  .seg button{flex:1;background:transparent;border:none;color:var(--muted);font:inherit;font-weight:600;font-size:13.5px;padding:9px;border-radius:8px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--accent);color:#141520}
  #auditmeta{margin-top:0}

  /* objections: modes + tools */
  .modes{display:flex;gap:7px;margin-top:14px;background:var(--card);padding:5px;border-radius:12px;border:1px solid var(--line)}
  .modes button{flex:1;background:transparent;border:none;color:var(--muted);font:inherit;font-weight:600;font-size:13.5px;padding:9px;border-radius:8px;cursor:pointer;transition:.15s}
  .modes button.on{background:var(--accent-soft);color:#c7bdf5}
  .otools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .search{flex:1;min-width:170px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-size:13.5px}
  .search::placeholder{color:var(--faint)} .search:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer;transition:.14s}
  .chip:hover{border-color:var(--line-2)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:#c7bdf5}
  .chip .n{opacity:.6;font-size:11px;margin-left:3px}
  .ocount{font-size:12px;color:var(--faint);margin:12px 2px 4px}
  .obj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:10px}
  .obj .ocat{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:7px}
  .oq{display:flex;gap:9px;align-items:flex-start}
  .oq .tag{flex:none;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--red);background:var(--red-soft);border:1px solid rgba(220,38,38,.28);padding:2px 7px;border-radius:5px;margin-top:2px}
  .oq .txt{font-size:15px;font-weight:600}
  .oa{display:flex;gap:9px;align-items:flex-start;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
  .oa .tag{flex:none;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:#8bd6a8;background:rgba(22,163,74,.13);border:1px solid rgba(22,163,74,.28);padding:2px 7px;border-radius:5px;margin-top:2px}
  .oa .txt{font-size:14px;color:#d7d7e6}
  .obj.hideA .oa{display:none}
  .odel{float:right;background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
  .odel:hover{color:var(--red)}
  .obj.mine{border-left:3px solid var(--accent)}

  .stage{margin-top:16px}
  .flash{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line-2);border-radius:18px;padding:26px 22px;min-height:230px;display:flex;flex-direction:column}
  .flash .fcat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .flash .client{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:14px 0 4px;line-height:1.35}
  .flash .clienttag{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .reveal{margin-top:auto;padding-top:20px}
  .answerbox{background:rgba(22,163,74,.08);border:1px solid rgba(22,163,74,.22);border-radius:12px;padding:14px 15px;margin-top:14px}
  .answerbox .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8bd6a8;font-weight:700;margin-bottom:6px}
  .answerbox .t{font-size:15.5px;color:#e6e6f0;line-height:1.5}
  .tctrl{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
  .tctrl .btn{flex:1;min-width:130px;padding:13px}
  .tmeta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px;color:var(--muted)}
  .tmeta .rs{background:none;border:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}

  /* add modal */
  .ov{position:fixed;inset:0;background:rgba(10,11,20,.72);z-index:60;display:none;align-items:flex-end;justify-content:center}
  .ov.on{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line-2);border-radius:18px 18px 0 0;width:100%;max-width:860px;padding:20px 18px 26px;max-height:88vh;overflow:auto}
  @media(min-width:600px){.ov{align-items:center;padding:20px}.sheet{border-radius:18px}}
  .sheet h3{font-size:16px;font-weight:600;margin-bottom:4px}
  .sheet p{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
  .field textarea{min-height:80px;resize:vertical}
  .field :focus{outline:none;border-color:var(--accent)}
  .frow{display:flex;gap:9px;margin-top:6px}
  .frow .btn{flex:1;padding:12px}

  /* finances */
  .finintro{font-size:13px;color:var(--muted);margin:14px 2px 2px;line-height:1.5}
  .finhead{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:16px;padding:16px 17px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .finhead::after{content:"";position:absolute;top:-40px;right:-30px;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle,rgba(145,132,217,.55),rgba(145,132,217,0) 68%);pointer-events:none}
  .finhead .ht{position:relative;z-index:1}
  .finhead .ht .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .finhead .ht .v{font-size:16px;font-weight:600;margin-top:2px}
  .health{position:relative;z-index:1;font-size:12.5px;font-weight:700;color:#fff;padding:7px 13px;border-radius:999px;white-space:nowrap}
  .health.g{background:linear-gradient(135deg,#16a34a,#3ddc88)}
  .health.o{background:linear-gradient(135deg,#d1861f,#f0b44e)}
  .health.r{background:linear-gradient(135deg,#c22,#f4756b)}
  .health.n{background:linear-gradient(135deg,#3a3d55,#565a7d)}
  .synthbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 4px;margin-top:8px}
  .bubble{display:flex;gap:11px;padding:14px 14px}
  .bubble .av{flex:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#6a5ec0);display:grid;place-items:center;font-size:17px}
  .bubble .bd{font-size:14px;line-height:1.6;color:#dcdce8}
  .bubble .bd p{margin:0 0 9px} .bubble .bd p:last-child{margin:0}
  .bubble .bd b{color:#fff;font-weight:600}
  .bubble .bd .hi-r{color:#f77;font-weight:600}.bubble .bd .hi-g{color:#5bd48a;font-weight:600}.bubble .bd .hi-o{color:#e8a33d;font-weight:600}
  .btnrow{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
  .btnrow .btn{flex:1;min-width:120px}
  .reset-in{display:flex;justify-content:flex-end;margin-top:18px}
  .btn.warned{background:#dc2626 !important;color:#fff !important;border-color:#dc2626 !important}

  /* scripts + ROI */
  .roi{background:linear-gradient(135deg,rgba(145,132,217,.16),var(--card) 70%);border:1px solid var(--accent);border-radius:16px;padding:16px;margin-top:14px}
  .roi .rk{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .roi .rsub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}
  .roigrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
  .roires2{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
  .roirow{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0}
  .roirow .l{color:var(--muted)} .roirow .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .roiverdict{background:rgba(22,163,74,.10);border:1px solid rgba(22,163,74,.25);border-radius:11px;padding:12px 13px;margin-top:12px;font-size:14px;line-height:1.5}
  .roiverdict b{color:#5bd48a}
  .roidisc{font-size:11.5px;color:var(--faint);margin-top:11px;line-height:1.45}
  .scriptcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
  .scriptcard .sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .scriptcard h4{font-size:14px;font-weight:600}
  .scriptcard .sb{white-space:pre-wrap;font-size:13px;color:#c7c7d6;line-height:1.55}
  .copybtn{background:transparent;border:1px solid var(--line-2);color:var(--muted);border-radius:8px;padding:5px 11px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;flex:none}
  .copybtn:hover{border-color:var(--accent);color:#c7bdf5}
  .fingrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  @media(max-width:560px){.fingrid{grid-template-columns:1fr}}
  .fnf{margin-bottom:0}
  .fnf label{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:5px}
  .fnf label span{color:var(--accent);text-transform:none;letter-spacing:0;font-weight:500}
  .fnf .inp{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .fnf input{flex:1;background:transparent;border:none;color:var(--ink);padding:10px 12px;font:inherit;font-size:15px;font-variant-numeric:tabular-nums;min-width:0}
  .fnf input:focus{outline:none}
  .fnf .inp:focus-within{border-color:var(--accent)}
  .fnf .u{color:var(--faint);font-size:13px;padding:0 12px;white-space:nowrap}
  .sect{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:24px 2px 6px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.kpis{grid-template-columns:1fr}}
  .kpi{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:12px;padding:12px 13px}
  .kpi.g{border-left-color:#16a34a;background:linear-gradient(90deg,rgba(22,163,74,.09),var(--card) 58%)}
  .kpi.o{border-left-color:#e8a33d;background:linear-gradient(90deg,rgba(232,163,61,.10),var(--card) 58%)}
  .kpi.r{border-left-color:#dc2626;background:linear-gradient(90deg,rgba(220,38,38,.10),var(--card) 58%)}
  .kpi .kl{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .kpi .kv{font-size:21px;font-weight:600;letter-spacing:-.01em;margin-top:3px;font-variant-numeric:tabular-nums}
  .kpi.g .kv{color:#5bd48a}.kpi.o .kv{color:#e8a33d}.kpi.r .kv{color:#f77}
  .kpi .kb{font-size:11.5px;color:var(--faint);margin-top:4px}
  .kpi .ke{font-size:12px;color:var(--muted);margin-top:7px;padding-top:7px;border-top:1px solid var(--line);line-height:1.45}
  .finempty{color:var(--faint);font-size:13px;padding:16px 2px}
  .lex details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:7px;padding:0 13px}
  .lex summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center}
  .lex summary::-webkit-details-marker{display:none}
  .lex summary::before{content:'＋';color:var(--accent);margin-right:9px;font-weight:700}
  .lex details[open] summary::before{content:'−'}
  .lex .lc{font-size:13px;color:var(--muted);padding:0 0 13px;line-height:1.55}
  .lex .lc b{color:var(--ink);font-weight:600}
  .lex .lc .fx{color:var(--accent);font-size:12.5px}

/* ============================================================
   REDESIGN HIGH-TECH ÉDITORIAL — PYROS Accompagnement
   (surcouche : n'altère aucune logique, restyle l'apparence)
   ============================================================ */
:root{
  --accent2:#b5abfc; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.07);
  --hair:rgba(255,255,255,.09); --glow:rgba(145,132,217,.5);
}
html,body{background:#0f111c}
/* fond high-tech : lueur + grille baseline + halo */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 50% -12%, rgba(145,132,217,.16), transparent 62%),
    radial-gradient(760px 520px at 110% 108%, rgba(145,132,217,.10), transparent 60%),
    linear-gradient(#10121e,#0d0f18);}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:1;
  background-image:linear-gradient(rgba(145,132,217,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(145,132,217,.06) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask:radial-gradient(circle at 50% 16%,#000 55%,transparent 95%);mask:radial-gradient(circle at 50% 16%,#000 55%,transparent 95%);}

/* header éditorial + réticules HUD */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(15,17,28,.94) 72%,rgba(15,17,28,0));backdrop-filter:blur(14px)}
header .kicker{font-size:10.5px;letter-spacing:.34em;color:var(--accent2);position:relative;padding-left:26px}
header .kicker::before{content:"";position:absolute;left:0;top:50%;width:18px;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
h1#h1,header h1{font-weight:800;font-size:26px;letter-spacing:-.03em;background:linear-gradient(180deg,#fff,#c9c4ea);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-top:3px}
.brandrow{position:relative}
.brandrow::after{content:"";position:absolute;right:2px;top:-2px;width:16px;height:16px;border-top:1.5px solid var(--accent);border-right:1.5px solid var(--accent);opacity:.55}

/* nav segmentée — glassmorphism */
.seg{background:var(--glass);border:1px solid var(--hair);backdrop-filter:blur(10px);border-radius:12px;padding:4px;gap:2px}
.seg button{border-radius:9px;letter-spacing:.01em}
.seg button.on{background:linear-gradient(180deg,var(--accent),#7d6fce);color:#0d0f1a;box-shadow:0 4px 16px -6px var(--glow)}
.segpitch{color:var(--accent2)!important;position:relative}
.segpitch::after{content:"";position:absolute;top:6px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pp 1.8s ease-in-out infinite}
@keyframes pp{0%,100%{opacity:.4}50%{opacity:1}}

/* cartes → verre dépoli + filet + coin HUD */
.zcard,.tile,.kpi,.panelbox,.scriptcard,.synthbox,.roi,.idcard,.health,.answerbox,.bubble,.prio,.block,.finhead,.fingrid>*,.statgrp,.sheet{
  background:var(--glass)!important;border:1px solid var(--hair)!important;backdrop-filter:blur(9px);
  border-radius:14px!important;transition:.16s}
.zcard:hover,.tile:hover{border-color:rgba(145,132,217,.4)!important;transform:translateY(-1px);box-shadow:0 10px 30px -14px var(--glow)}
.zcard.special{background:linear-gradient(150deg,rgba(145,132,217,.14),var(--glass))!important;border-color:rgba(145,132,217,.3)!important}
.kicker{color:var(--accent2)}
.sect>h2,.sh,.ht .k{letter-spacing:.02em}
.kpi .n,.rk,.pnum{color:var(--accent2)}
/* pastilles statut */
.st.ok,.ok{--x:1}
.btn{border-radius:11px;border:1px solid var(--hair);background:var(--glass2);transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.ghost{background:transparent}
.chip,.chips button,.fcat,.ocat{border-radius:20px;border:1px solid var(--hair);background:var(--glass)}
.chip.on,.chips button.on,.fcat.on,.ocat.on{background:var(--accent);color:#0d0f1a;border-color:var(--accent)}
.bar{background:rgba(255,255,255,.06)}
.bar i{background:linear-gradient(90deg,var(--accent),var(--accent2))!important}
.search input,.inp,input,textarea{background:rgba(255,255,255,.04)!important;border:1px solid var(--hair)!important;border-radius:10px}
.search input:focus,.inp:focus,input:focus{border-color:var(--accent)!important;outline:none}


/* ===== ICÔNES EN BULLES + FOND QUADRILLÉ (DA Machine à contenu) ===== */
:root{--line2:rgba(145,132,217,.42);--lav2:#b4a9f0}
/* bulle inline dans les titres de zone */
.zico{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;
  border:1.5px solid var(--line2);background:rgba(145,132,217,.1);vertical-align:-.4em;
  margin-right:.4em;flex:0 0 auto;box-shadow:0 0 0 4px rgba(145,132,217,.045)}
.zico .zsvg{width:64%;height:64%}
/* bulle large sur les cartes de zone du tableau de bord */
.zcard .ic,.tile .ic,.zc .ic{width:56px!important;height:56px!important;border-radius:50%!important;
  border:1.5px solid var(--line2)!important;background:rgba(145,132,217,.09)!important;
  display:grid!important;place-items:center;padding:0!important;font-size:0!important;
  box-shadow:0 0 0 5px rgba(145,132,217,.04);transition:.16s}
.zcard .ic .zsvg,.tile .ic .zsvg,.zc .ic .zsvg{width:56%;height:56%}
.zcard:hover .ic,.tile:hover .ic{border-color:var(--lav2)!important;box-shadow:0 0 0 5px rgba(145,132,217,.1),0 0 20px -4px rgba(145,132,217,.5)}
.bkgroup h3 .zico{width:1.35em;height:1.35em}

</style>
<style>
/* ===== FLUIDITÉ DE NAVIGATION ===== */
#app>*{animation:viewIn .34s cubic-bezier(.22,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#deck.open,#scriptov.open{animation:ovIn .3s cubic-bezier(.22,.7,.2,1) both}
@keyframes ovIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.sbtn,.item,.note,.zcard,.tile,.chip,.fcat,.ocat,.copybtn,.btn,.back{transition:background .18s,border-color .18s,color .18s,transform .12s,box-shadow .18s}
.sbtn:active,.btn:active,.copybtn:active,.back:active,.zcard:active{transform:scale(.97)}
.seg button{transition:background .22s cubic-bezier(.22,.7,.2,1),color .2s,box-shadow .22s}
.deck-nav button:active,.deck-dots i{transition:transform .15s,opacity .2s,background .2s}
@media (prefers-reduced-motion:reduce){#app>*,#deck.open,#scriptov.open{animation:none}}
</style>
</head>
<body>
<header>
  <div class="brandrow">
    <div>
      <div class="kicker">PYROS Accompagnement</div>
      <h1 id="h1">Audit terrain</h1>
    </div>
  </div>
  <div class="seg">
    <button id="s-audit" class="on">Audit</button>
    <button id="s-obj">Objections</button>
    <button id="s-fin">Finances</button>
    <button id="s-pitch" class="segpitch">Pitch ▸</button>
    <button id="s-script" class="segscript">Script ▸</button>
  </div>
  <div id="auditmeta">
    <div class="meta">
      <input id="m-client" placeholder="Établissement" autocomplete="off">
      <input id="m-date" type="date">
      <input id="m-auditor" placeholder="Auditeur" autocomplete="off">
    </div>
    <div class="prog"><div class="bar"><i id="gbar"></i></div><b id="gtxt">0 / 0</b></div>
  </div>
</header>

<main id="app"></main>

<div class="ov" id="ov"><div class="sheet">
  <h3>Ajouter une objection</h3>
  <p>Note une vraie phrase entendue sur le terrain et ta meilleure réponse. Elle rejoint ta banque.</p>
  <div class="field"><label>Catégorie</label><select id="f-cat"></select></div>
  <div class="field"><label>Ce que dit le client</label><textarea id="f-q" placeholder="« C'est trop cher pour moi… »"></textarea></div>
  <div class="field"><label>Ta réponse</label><textarea id="f-a" placeholder="Ta parade…"></textarea></div>
  <div class="frow"><button class="btn ghost" id="f-cancel">Annuler</button><button class="btn" id="f-save">Enregistrer</button></div>
</div></div>

<div class="toast" id="toast"></div>
<div class="foot" id="foot"></div>

<script>
"use strict";
const SCHEMA = 'v2';
const KEY = 'pyros_audit_' + SCHEMA;

/* ===== ICÔNES DE ZONES (line-art, DA Machine à contenu) ===== */
const ZICONS={
 salle:'<rect x="32" y="44" width="136" height="112" rx="13"/><circle cx="72" cy="80" r="13" stroke="#9184d9"/><circle cx="128" cy="80" r="13"/><circle cx="72" cy="122" r="13"/><circle cx="128" cy="122" r="13" stroke="#9184d9"/>',
 cuisine:'<path d="M62 126 C40 126 36 90 60 84 C53 58 87 46 100 65 C113 46 147 58 140 84 C164 90 160 126 138 126 Z"/><line x1="62" y1="126" x2="138" y2="126" stroke="#9184d9"/><line x1="70" y1="126" x2="70" y2="158"/><line x1="100" y1="126" x2="100" y2="158"/><line x1="130" y1="126" x2="130" y2="158"/>',
 carte:'<rect x="54" y="30" width="92" height="140" rx="11"/><line x1="76" y1="60" x2="124" y2="60" stroke="#9184d9"/><line x1="72" y1="94" x2="128" y2="94"/><line x1="72" y1="118" x2="128" y2="118"/><line x1="72" y1="142" x2="106" y2="142"/>',

 achats:'<rect x="28" y="72" width="84" height="62" rx="9"/><path d="M112 90 h30 l26 26 v18 h-56 Z"/><circle cx="66" cy="146" r="13" stroke="#9184d9"/><circle cx="140" cy="146" r="13" stroke="#9184d9"/>',
 personnel:'<circle cx="74" cy="70" r="22"/><path d="M36 150 a40 40 0 0 1 76 0"/><circle cx="142" cy="80" r="17" stroke="#9184d9"/><path d="M114 150 a30 30 0 0 1 54 0" stroke="#9184d9"/>',
 direction:'<circle cx="94" cy="106" r="60"/><circle cx="94" cy="106" r="32"/><circle cx="94" cy="106" r="7" stroke="#9184d9"/><line x1="94" y1="106" x2="150" y2="50" stroke="#9184d9"/><polyline points="132,48 154,46 152,68" stroke="#9184d9"/>',
 marketing:'<path d="M38 86 v26 l26 5 l54 28 V52 L64 81 Z"/><path d="M64 117 v22 a11 11 0 0 0 22 0 v-12" stroke="#9184d9"/><path d="M134 76 a30 30 0 0 1 0 46" stroke="#9184d9"/>',
 experience:'<path d="M100 30 l19 44 47 5 -35 33 9 47 -40-24 -40 24 9-47 -35-33 47-5 Z"/>',
 concurrence:'<circle cx="100" cy="100" r="60"/><line x1="100" y1="28" x2="100" y2="50"/><line x1="100" y1="150" x2="100" y2="172"/><line x1="28" y1="100" x2="50" y2="100"/><line x1="150" y1="100" x2="172" y2="100"/><circle cx="100" cy="100" r="6" stroke="#9184d9"/><circle cx="132" cy="74" r="8" stroke="#9184d9"/><circle cx="70" cy="122" r="8"/>',
 priorites:'<path d="M100 26 C128 46 140 84 132 122 l-13 20 h-38 l-13-20 C60 84 72 46 100 26 Z"/><circle cx="100" cy="84" r="14" stroke="#9184d9"/><path d="M84 142 l-18 28 26-9 M116 142 l18 28 -26-9" stroke="#9184d9"/>'
};
const ZSVG=id=>'<svg class="zsvg" viewBox="0 0 200 200" fill="none" stroke="#F2F2F8" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">'+(ZICONS[id]||'')+'</svg>';
const ZBUB=id=>'<span class="zico">'+ZSVG(id)+'</span>';

const ZONES = [
 {id:'salle', ic:'🍽️', name:'Salle & agencement', items:[
   'Capacité réelle vs théorique (nombre de couverts)',
   'Circulation entre les tables (fluidité du service)',
   'Densité et espacement des tables',
   'Tables premium et tables mal placées identifiées',
   'Confort des assises',
   'Niveau sonore et acoustique',
   'Éclairage (ambiance vs fonctionnel)',
   'Température et ventilation',
   'Décoration cohérente avec le positionnement',
   'Propreté et état général (sols, murs, mobilier)',
   'Façade, vitrine et signalétique extérieure',
   'Entrée et premier regard du client',
   'Zone d\u2019attente / bar',
   'État des toilettes',
   'Accessibilité PMR',
   'Terrasse (état, potentiel, dépendance météo)'
 ]},
 {id:'cuisine', ic:'👨‍🍳', name:'Cuisine & production', items:[
   'Agencement et flux de travail (marche en avant)',
   'État et entretien du matériel',
   'Organisation de la mise en place',
   'Timing de production vs pics de service',
   'Stockage sec et réserve (organisation, DLC)',
   'Chambres froides (température, rangement, rotations)',
   'Gestion et rotation des stocks',
   'Hygiène, HACCP et traçabilité',
   'Pertes, casse et gaspillage observés',
   'Nombre de références gérées en cuisine',
   'Fiches techniques existantes et à jour ?',
   'Régularité et qualité des dressages',
   'Coordination cuisine ↔ salle (temps d\u2019envoi)',
   'Capacité à absorber un coup de feu'
 ]},
 {id:'carte', ic:'📋', name:'Carte & offre', items:[
   'Nombre de plats à la carte',
   'Lisibilité et présentation de la carte',
   'Répétitions et incohérences',
   'Saisonnalité de l\u2019offre',
   'Plats signatures identifiables',
   'Données de vente disponibles (menu engineering)',
   'Classement Stars / Plow Horses / Puzzles / Dogs possible ?',
   'Cohérence prix ↔ positionnement',
   'Offre desserts (choix, marge, mise en avant)',
   'Formules et menus en plusieurs temps',
   'Carte des boissons (vin, cocktails, mocktails)',
   'Accords et suggestions proposés',
   'Ventes additionnelles en place (apéro, café gourmand…)',
   'Carte du jour / adaptive'
 ]},
 {id:'ratios', ic:'💶', name:'Ratios & rentabilité', items:[
   'Food cost global connu et suivi ?',
   'Food cost par plat',
   'Marge brute par plat',
   'Méthode de fixation des prix (coefficient)',
   'Ticket moyen actuel',
   'Pertes et casse chiffrées',
   'Coûts matière suivis dans le temps',
   'Complexité opérationnelle vs rentabilité des plats',
   'Plats vendus à perte identifiés'
 ]},
 {id:'achats', ic:'🚚', name:'Achats & fournisseurs', items:[
   'Cartographie des fournisseurs',
   'Date de la dernière négociation des prix',
   'Nombre de fournisseurs par famille de produits',
   'Fréquence et méthode de commande',
   'Contrôle des réceptions (poids, qualité)',
   'Contrôle des dépenses et de la conso',
   'Ruptures fréquentes ?',
   'Dépendance à un fournisseur unique'
 ]},
 {id:'personnel', ic:'👥', name:'Personnel & management', items:[
   'Organigramme et effectif réel',
   'Masse salariale et ratio masse salariale / CA',
   'Plannings et emplois du temps',
   'Postes clés couverts (chef, second, barista, sommelier, barman, vendeur)',
   'Recrutements en cours ou en difficulté',
   'Turnover de l\u2019équipe',
   'Formation et montée en compétence',
   'Motivation et état d\u2019esprit de l\u2019équipe',
   'Fiches de poste et process écrits',
   'Répartition des pourboires et gestion de la caisse',
   'Polyvalence de l\u2019équipe'
 ]},
 {id:'direction', ic:'🎯', name:'Direction & stratégie', items:[
   'Vision et ambition du dirigeant',
   'Objectifs chiffrés (CA, marge, développement)',
   'Positionnement clair et assumé ?',
   'Identité de marque définie',
   'Mode de décision et capacité à déléguer',
   'Points de blocage perçus par le dirigeant',
   'Historique (ancienneté, évolution du CA)',
   'Rentabilité globale de l\u2019établissement',
   'Projets en cours ou en attente'
 ]},
 {id:'marketing', ic:'📱', name:'Marketing & visibilité', items:[
   'Instagram (fréquence, qualité, engagement)',
   'TikTok (présence, contenu)',
   'Fiche Google Business (complète, photos, horaires)',
   'Avis clients (note, volume, réponses apportées)',
   'Site web et réservation en ligne',
   'SEO / TripAdvisor / Booking',
   'Qualité des photos de plats',
   'Programme de fidélité',
   'Jeux concours et animations',
   'Partenariats et influence locale',
   'Emailing / SMS / base clients',
   'Événements (afterwork, soirée à thème, sunset menu)'
 ]},
 {id:'experience', ic:'✨', name:'Expérience & parcours client', items:[
   'Qualité de l\u2019accueil',
   'Prise de commande et conseil',
   'Upselling et suggestions du personnel',
   'Gestion de l\u2019attente (distraction, timing)',
   'Encaissement et départ',
   'Réservation (canaux, taux de remplissage)',
   'Click & collect / vente à emporter',
   'Offre traiteur et événementiel',
   'Service premium (chef à table, service à la minute)'
 ]},
 {id:'concurrence', ic:'🥊', name:'Concurrence', items:[
   'Concurrent direct nº1 (nom, angle)',
   'Concurrent direct nº2 (nom, angle)',
   'Concurrent direct nº3 (nom, angle)',
   'Concurrent direct nº4 (nom, angle)',
   'Concurrent direct nº5 (nom, angle)',
   'Prix pratiqués par la concurrence',
   'Offres et animations du moment',
   'Positionnement relatif de l\u2019établissement'
 ]},
 {id:'priorites', ic:'🚀', name:'Opportunités & priorités', items:[
   'Goulots d\u2019étranglement majeurs',
   'Quick wins (fort impact, faible effort)',
   'Opportunités de croissance prioritaires',
   'Leviers de panier moyen',
   'Idées de plats signatures',
   '15 actions prioritaires (brouillon de fin d\u2019audit)'
 ]}
];

const ZMAP = Object.fromEntries(ZONES.map(z=>[z.id,z]));
const TOTAL = ZONES.reduce((n,z)=>n+z.items.length,0);

// ---- state ----
let state = load();
let view = {name:'home', zone:null};

function blank(){return {meta:{client:'',date:'',auditor:'Angelo'}, items:{}, fin:{}};}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);s.meta=s.meta||{};s.items=s.items||{};s.fin=s.fin||{};return s;}}catch(e){}
  return blank();
}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}},120);}
function it(id){return state.items[id]||(state.items[id]={status:null,note:''});}
function zoneStats(z){let d=0,f=0;z.items.forEach((_,i)=>{const s=state.items[z.id+'-'+i];if(s){if(s.status)d++;if(s.status==='issue')f++;}});return{done:d,flag:f,total:z.items.length};}
function globalStats(){let d=0,f=0;for(const k in state.items){if(state.items[k].status)d++;if(state.items[k].status==='issue')f++;}return{done:d,flag:f,total:TOTAL};}

// ---- render ----
const app=document.getElementById('app');
const mClient=document.getElementById('m-client'), mDate=document.getElementById('m-date'), mAuditor=document.getElementById('m-auditor');
mClient.value=state.meta.client||''; mDate.value=state.meta.date||''; mAuditor.value=state.meta.auditor||'Angelo';
[[mClient,'client'],[mDate,'date'],[mAuditor,'auditor']].forEach(([el,k])=>{
  el.addEventListener('input',()=>{state.meta[k]=el.value;save();if(view.name==='export')render();});
});

function header(){
  const g=globalStats();
  document.getElementById('gbar').style.width=(g.total?g.done/g.total*100:0)+'%';
  document.getElementById('gtxt').textContent=g.done+' / '+g.total+(g.flag?'  ·  ● '+g.flag:'');
}

let section='audit';
function render(){
  document.getElementById('s-audit').classList.toggle('on',section==='audit');
  document.getElementById('s-obj').classList.toggle('on',section==='obj');
  document.getElementById('s-fin').classList.toggle('on',section==='fin');
  const am=document.getElementById('auditmeta');
  if(section==='obj'){am.style.display='none';document.getElementById('h1').textContent='Objections';return renderObj();}
  if(section==='fin'){am.style.display='none';document.getElementById('h1').textContent='Finances';return renderFin();}
  am.style.display='';document.getElementById('h1').textContent='Audit terrain';
  header();
  if(view.name==='home') return renderHome();
  if(view.name==='zone') return renderZone(view.zone);
  if(view.name==='bottlenecks') return renderBottlenecks();
  if(view.name==='export') return renderExport();
}
document.getElementById('s-audit').onclick=()=>{section='audit';scrollTo(0,0);render();};
document.getElementById('s-obj').onclick=()=>{section='obj';scrollTo(0,0);render();};
document.getElementById('s-fin').onclick=()=>{section='fin';scrollTo(0,0);render();};

function renderHome(){
  let h='<div class="grid">';
  ZONES.forEach(z=>{
    const s=zoneStats(z), pct=s.total?s.done/s.total*100:0;
    h+=`<button class="zcard" data-zone="${z.id}">
      <div class="ic">${ZSVG(z.id)}</div>
      <div class="nm">${z.name}</div>
      <div class="mini"><i style="width:${pct}%"></i></div>
      <div class="st"><span class="frac">${s.done} / ${s.total}</span>${s.flag?`<span class="flagpill">● ${s.flag}</span>`:''}</div>
    </button>`;
  });
  const g=globalStats();
  h+=`<button class="zcard special" data-go="bottlenecks">
      <div class="ic">🔴</div><div class="nm">Problèmes à traiter</div>
      <div class="st"><span class="frac">${g.flag} point${g.flag>1?'s':''} en rouge</span></div>
    </button>
    <button class="zcard special" data-go="export">
      <div class="ic">📄</div><div class="nm">Synthèse & export du dossier</div>
      <div class="st"><span class="frac">Copier · Télécharger</span></div>
    </button>`;
  h+='</div>';
  app.innerHTML=h;
  app.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{view={name:'zone',zone:b.dataset.zone};scrollTo(0,0);render();});
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view={name:b.dataset.go};scrollTo(0,0);render();});
}

function autosize(t){t.style.height='auto';t.style.height=t.scrollHeight+'px';}

function renderZone(zid){
  const z=ZMAP[zid], s=zoneStats(z);
  let h=`<div class="topline"><button class="back" data-home>←</button><h2>${ZBUB(z.id)}${z.name}</h2></div>
    <div class="zsub">${s.done} / ${s.total} évalués${s.flag?`  ·  ● ${s.flag} problème${s.flag>1?'s':''}`:''}</div>`;
  z.items.forEach((label,i)=>{
    const id=z.id+'-'+i, st=it(id);
    h+=`<div class="item ${st.status==='ok'?'ok':''} ${st.status==='issue'?'issue':''}" data-item="${id}">
      <div class="lbl">${label}</div>
      <div class="statgrp">
        <button class="sbtn ok" data-act="ok" aria-pressed="${st.status==='ok'}"><span class="d">●</span> Conforme</button>
        <button class="sbtn ko" data-act="ko" aria-pressed="${st.status==='issue'}"><span class="d">●</span> Problème</button>
      </div>
      <textarea class="note" data-act="note" placeholder="Note, réponse, chiffre, point de blocage…">${(st.note||'').replace(/</g,'&lt;')}</textarea>
    </div>`;
  });
  app.innerHTML=h;
  app.querySelector('[data-home]').onclick=()=>{view={name:'home'};scrollTo(0,0);render();};
  app.querySelectorAll('.item').forEach(row=>{
    const id=row.dataset.item, st=it(id);
    const okB=row.querySelector('[data-act="ok"]'), koB=row.querySelector('[data-act="ko"]'), note=row.querySelector('[data-act="note"]');
    function paint(){okB.setAttribute('aria-pressed',st.status==='ok');koB.setAttribute('aria-pressed',st.status==='issue');
      row.classList.toggle('ok',st.status==='ok');row.classList.toggle('issue',st.status==='issue');header();updateZsub(z);}
    okB.onclick=()=>{st.status=st.status==='ok'?null:'ok';save();paint();};
    koB.onclick=()=>{st.status=st.status==='issue'?null:'issue';save();paint();};
    note.addEventListener('input',()=>{st.note=note.value;save();autosize(note);});
    autosize(note);
  });
}
function updateZsub(z){const s=zoneStats(z);const el=document.querySelector('.zsub');if(el)el.innerHTML=`${s.done} / ${s.total} évalués${s.flag?`  ·  ● ${s.flag} problème${s.flag>1?'s':''}`:''}`;}

function renderBottlenecks(){
  let h=`<div class="topline"><button class="back" data-home>←</button><h2>🔴 Problèmes à traiter</h2></div>
    <div class="zsub">Tous les points marqués en rouge, prêts à devenir tes actions prioritaires.</div>`;
  let any=false, body='';
  ZONES.forEach(z=>{
    const flagged=z.items.map((l,i)=>({l,st:state.items[z.id+'-'+i]})).filter(o=>o.st&&o.st.status==='issue');
    if(!flagged.length) return; any=true;
    body+=`<div class="bkgroup"><h3>${ZBUB(z.id)}${z.name}</h3>`;
    flagged.forEach(o=>{body+=`<div class="bkitem">${o.l}${o.st.note?`<div class="bn">${o.st.note.replace(/</g,'&lt;')}</div>`:''}</div>`;});
    body+='</div>';
  });
  h+= any? body : `<div class="empty">Aucun problème marqué pour l\u2019instant.<br>Pendant l\u2019entretien, touche « Problème » sur un point pour le remonter ici.</div>`;
  app.innerHTML=h;
  app.querySelector('[data-home]').onclick=()=>{view={name:'home'};scrollTo(0,0);render();};
}

function buildDossier(){
  const m=state.meta, g=globalStats();
  let o=`# Audit terrain — PYROS Accompagnement\n\n`;
  o+=`Établissement : ${m.client||'—'}\n`;
  o+=`Date : ${m.date||'—'}\n`;
  o+=`Auditeur : ${m.auditor||'—'}\n`;
  o+=`Avancement : ${g.done}/${g.total} évalués · ${g.flag} problème(s)\n\n`;
  o+=`## Problèmes / goulots d'étranglement (priorités)\n`;
  let f=0;
  ZONES.forEach(z=>z.items.forEach((l,i)=>{const s=state.items[z.id+'-'+i];if(s&&s.status==='issue'){f++;o+=`- [${z.name}] ${l}${s.note?` — ${s.note}`:''}\n`;}}));
  if(!f)o+=`- (aucun pour l'instant)\n`;
  o+=`\n## Détail par zone\n`;
  ZONES.forEach(z=>{
    const s=zoneStats(z);
    o+=`\n### ${z.name}  (${s.done}/${s.total})\n`;
    z.items.forEach((l,i)=>{const st=state.items[z.id+'-'+i]||{};
      const mk=st.status==='ok'?'[OK]':st.status==='issue'?'[PROBLÈME]':'[ ]';
      o+=`- ${mk} ${l}${st.note?` — ${st.note}`:''}\n`;});
  });
  return o;
}

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function frDate(d){if(!d)return '—';try{return new Date(d+'T00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}

function printReport(){
  const html=buildReportHTML();
  const w=window.open('','_blank');
  if(w){w.document.open();w.document.write(html);w.document.close();w.focus();
    setTimeout(()=>{try{w.print();}catch(e){}},450);}
  else{const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(f);f.onload=()=>{setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print();}catch(e){}},350);};f.srcdoc=html;}
}
function downloadReport(){
  const slug=(state.meta.client||'audit').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'audit';
  const name=`dossier-audit-${slug}-${state.meta.date||'sans-date'}.html`;
  const blob=new Blob([buildReportHTML()],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Dossier téléchargé');
}

/* Two-tap confirm (native confirm() is blocked in sandboxed previews) */
function wireReset(btn,doReset){
  if(!btn)return;
  btn.onclick=()=>{
    if(btn.dataset.armed==='1'){clearTimeout(btn._rt);doReset();return;}
    btn.dataset.armed='1';btn._orig=btn.textContent;btn.textContent='Confirmer ?';btn.classList.add('warned');
    btn._rt=setTimeout(()=>{btn.dataset.armed='';btn.textContent=btn._orig;btn.classList.remove('warned');},3500);
  };
}

const pct=v=>(v*100).toFixed(1).replace('.',',')+' %';
function computeFin(f){
  f=f||{};
  const ca=fnum(f.ca),mat=fnum(f.matiere),sal=fnum(f.salaires),loy=fnum(f.loyer),ene=fnum(f.energie),aut=fnum(f.autres),amo=fnum(f.amort),fin=fnum(f.financier),cv=fnum(f.couverts);
  const ok=ca>0, margeBrute=ca-mat, tauxMB=ok?margeBrute/ca:0;
  const foodPct=ok?mat/ca:0, salPct=ok?sal/ca:0, prime=mat+sal, primePct=ok?prime/ca:0, loyPct=ok?loy/ca:0;
  const ebe=ca-(mat+sal+loy+ene+aut), ebePct=ok?ebe/ca:0;
  const resExpl=ebe-amo, resNet=resExpl-fin, resNetPct=ok?resNet/ca:0;
  const fixes=sal+loy+ene+aut+amo+fin, tvm=1-foodPct, seuil=(ok&&tvm>0)?fixes/tvm:0;
  const ticket=cv>0?ca/cv:0;
  return {ok,ca,mat,sal,margeBrute,tauxMB,foodPct,salPct,prime,primePct,loyPct,ebe,ebePct,resExpl,resNet,resNetPct,seuil,ticket};
}
const _lb=(v,g,o)=>v<=g?'g':v<=o?'o':'r';
const _hb=(v,g,o)=>v>=g?'g':v>=o?'o':'r';

function finHealth(c){
  if(!c.ok)return {cls:'n',label:'À compléter'};
  const p=c.primePct*100,e=c.ebePct*100,r=c.resNetPct*100;
  if(e>=12&&p<=66&&r>=3)return {cls:'g',label:'Santé : saine'};
  if(e<0||r<0||p>73)return {cls:'r',label:'Santé : critique'};
  return {cls:'o',label:'Santé : fragile'};
}
function finNarrative(){
  const c=computeFin(state.fin), cl=state.meta.client||'Cet établissement';
  if(!c.ok)return {html:'<p>Saisis au moins le chiffre d\u2019affaires pour générer la synthèse.</p>',text:''};
  const P=[];
  P.push(`${cl} réalise <b>${eur(c.ca)}</b> de chiffre d\u2019affaires sur la période analysée.`);
  const fp=c.foodPct*100;
  P.push(`Le coût matière pèse <span class="${fp>35?'hi-r':fp>32?'hi-o':'hi-g'}">${pct(c.foodPct)}</span> du CA — ${fp>35?'au-dessus de la cible : la matière grignote la marge, il y a de la négociation fournisseurs et de l\u2019ingénierie de carte à faire.':fp>32?'dans le haut de la fourchette, à surveiller.':'bien maîtrisé.'}`);
  const sp=c.salPct*100;
  P.push(`La masse salariale représente <span class="${sp>45?'hi-r':sp>40?'hi-o':'hi-g'}">${pct(c.salPct)}</span> du CA — ${sp>45?'c\u2019est lourd : organisation, plannings et productivité sont à revoir.':sp>40?'à surveiller.':'sous contrôle.'}`);
  const pp=c.primePct*100;
  P.push(`Ensemble, matière et personnel forment un <b>prime cost</b> de <span class="${pp>70?'hi-r':pp>65?'hi-o':'hi-g'}">${pct(c.primePct)}</span> — ${pp>70?'critique : au-delà de 70 %, il ne reste presque rien pour le loyer, les charges et le bénéfice.':pp>65?'juste au-dessus de la cible de 65 %, à resserrer.':'maîtrisé, bon socle.'}`);
  if(c.loyPct>0){const lp=c.loyPct*100;P.push(`Le loyer absorbe <span class="${lp>12?'hi-r':lp>10?'hi-o':'hi-g'}">${pct(c.loyPct)}</span> du CA${lp>12?' — l\u2019emplacement pèse lourd, il faudra plus de volume pour l\u2019absorber.':'.'}`);}
  const ep=c.ebePct*100;
  P.push(`L\u2019exploitation dégage <b>${eur(c.ebe)}</b> d\u2019EBE (EBITDA), soit <span class="${ep>=12?'hi-g':ep>=5?'hi-o':'hi-r'}">${pct(c.ebePct)}</span> du CA — ${ep>=12?'c\u2019est sain.':ep>=5?'c\u2019est fragile, la marge de sécurité est mince.':ep>=0?'insuffisant pour investir ou encaisser un imprévu.':'l\u2019exploitation perd de l\u2019argent avant même les amortissements.'}`);
  P.push(`Au final, le résultat net ressort à <span class="${c.resNet<0?'hi-r':c.resNetPct*100<3?'hi-o':'hi-g'}">${eur(c.resNet)} (${pct(c.resNetPct)})</span> — ${c.resNet<0?'l\u2019établissement est en perte.':c.resNetPct*100<3?'à peine à l\u2019équilibre.':'l\u2019établissement est rentable.'} <span style="opacity:.65">(avant impôt)</span>`);
  P.push(`Le seuil de rentabilité est estimé à <b>${eur(c.seuil)}</b> de CA : en dessous, l\u2019établissement perd de l\u2019argent.`);
  if(c.ticket>0)P.push(`Le ticket moyen est de <b>${eur(c.ticket)}</b> — un levier rapide à faire monter (entrée, dessert, boisson, upsell).`);
  const probs=[];ZONES.forEach(z=>z.items.forEach((l,i)=>{const s=state.items[z.id+'-'+i];if(s&&s.status==='issue')probs.push(l+(s.note?` (${s.note})`:''));}));
  if(probs.length)P.push(`Côté terrain, points de blocage relevés à l\u2019audit : ${probs.slice(0,6).join(' ; ')}${probs.length>6?'…':''}.`);
  const recos=[];
  if(fp>35)recos.push('renégocier les achats et retravailler l\u2019ingénierie de carte');
  if(sp>45)recos.push('revoir l\u2019organisation et les plannings');
  if(pp>70)recos.push('faire redescendre le prime cost sous 65 %');
  if(c.loyPct*100>12)recos.push('augmenter le volume pour diluer le loyer');
  if(c.ticket>0&&recos.length<3)recos.push('augmenter le ticket moyen (upsell, menus, boissons)');
  if(!recos.length)recos.push('consolider et pousser le volume, les fondamentaux sont sains');
  P.push(`<b>En clair :</b> ${recos.slice(0,3).join(', ')}.`);
  return {html:P.map(p=>`<p>${p}</p>`).join(''), text:P.map(p=>p.replace(/<[^>]+>/g,'')).join('\n\n')};
}

 {c:"Temps / dispo", q:"On en reparle à la rentrée.", a:"Notons une date ferme, alors — sinon « la rentrée » devient « l'année prochaine ». Le premier lundi de septembre ?"},
 {c:"« Je vais réfléchir »", q:"Je vais réfléchir.", a:"Bien sûr. Pour réfléchir sur du concret plutôt que dans le vide : qu'est-ce qui vous retient — le prix, le timing, ou le fait de me faire confiance ?"},
 {c:"« Je vais réfléchir »", q:"Laissez-moi y penser.", a:"Je préfère ça à un oui mou. Concrètement, il vous manque quelle information pour trancher ?"},
 {c:"« Je vais réfléchir »", q:"Je dois voir si c'est le bon moment.", a:"Le bon moment est rarement évident. L'audit à 290 € vous donne les éléments pour décider sans vous engager — on part de là ?"},
 {c:"« Je vais réfléchir »", q:"Je vous rappelle.", a:"Avec plaisir — bloquons une date maintenant, sinon la vie reprend le dessus. Jeudi, ça vous va ?"},
 {c:"« Je vais réfléchir »", q:"Je ne suis pas sûr.", a:"Normal, on ne se connaît pas encore. Justement, l'audit sert à lever le doute avec des chiffres avant tout engagement."},
 {c:"« Je vais réfléchir »", q:"Il faut que ça mûrisse.", a:"Ce qui mûrit sans information tourne souvent en doute. Donnons de la matière à votre réflexion : l'audit d'abord, vous déciderez ensuite."},
 {c:"Confiance / preuves", q:"Je ne vous connais pas.", a:"Logique. Regardons d'abord votre établissement ensemble pendant l'audit : vous jugerez sur ce que je vois, pas sur des promesses."},
 {c:"Confiance / preuves", q:"Vous avez des références ?", a:"Oui, je peux vous montrer des avant/après et des retours clients. Et sur les premières missions, je propose une contrepartie transparente : étude de cas et témoignage."},
 {c:"Confiance / preuves", q:"Comment je sais que ça marche ?", a:"Parce qu'on part de vos chiffres réels. L'audit pose un diagnostic mesurable ; si le potentiel n'y est pas, je ne vous vends rien."},
 {c:"Confiance / preuves", q:"Vous êtes cuisinier, pas commercial.", a:"Exactement, et c'est ma force : je connais la cuisine, les coûts matière et la salle de l'intérieur. Je ne vends pas de la théorie, je parle votre métier."},
 {c:"Confiance / preuves", q:"Prouvez-moi que vous êtes légitime.", a:"Le meilleur test, c'est l'audit : en 90 minutes je vous montre des angles morts que vous ne voyez plus. Vous verrez tout de suite si je connais mon sujet."},
 {c:"Confiance / preuves", q:"J'ai déjà été déçu par un consultant.", a:"Je comprends. La différence : je livre de l'exécution concrète — cartes, fiches, ratios — pas un rapport qui prend la poussière. Et on démarre petit, avec l'audit."},
 {c:"Confiance / preuves", q:"Vous n'avez pas assez d'expérience.", a:"J'ai l'expérience du terrain, celle qui compte pour vos coûts et votre salle. Et je m'engage sur des livrables concrets, vérifiables."},
 {c:"Confiance / preuves", q:"Montrez-moi un cas comme le mien.", a:"Je peux vous montrer des cas proches. Mais le plus parlant reste votre propre audit : le vôtre, pas celui d'un autre."},
 {c:"« Je le fais moi-même »", q:"Je peux le faire moi-même.", a:"Sûrement, en partie. La vraie question : est-ce que vous le faites, avec le recul et le temps nécessaires ? Un regard extérieur voit ce que l'habitude cache."},
 {c:"« Je le fais moi-même »", q:"J'ai déjà un chef / une équipe pour ça.", a:"Parfait, ils exécutent. Moi j'apporte la stratégie et les chiffres — menu engineering, ratios, positionnement — que l'opérationnel n'a pas le temps de creuser."},
 {c:"« Je le fais moi-même »", q:"Je connais mon métier mieux que vous.", a:"Aucun doute, c'est votre maison. Je ne viens pas vous apprendre à cuisiner, mais à transformer votre cuisine en machine à marge et à clients."},
 {c:"« Je le fais moi-même »", q:"Je gère déjà bien mes coûts.", a:"Content de l'entendre. L'audit le confirmera ou révélera 2-3 fuites invisibles. Si tout est carré, vous serez rassuré ; sinon, ça se rembourse vite."},
 {c:"« Je le fais moi-même »", q:"Ma carte marche bien comme ça.", a:"Tant mieux. « Bien » et « optimal », c'est différent. On regarde quels plats vous font vraiment gagner de l'argent — souvent, ce ne sont pas ceux qu'on croit."},
 {c:"« Je le fais moi-même »", q:"J'ai déjà tout optimisé.", a:"Alors l'audit sera rapide et rassurant. Et s'il reste ne serait-ce qu'un levier, il se rembourse. Qu'avez-vous à perdre à vérifier ?"},
 {c:"Besoin / statu quo", q:"Je n'ai pas besoin de ça.", a:"Peut-être. Mais si je vous montre en 90 minutes 3 leviers de marge que vous ne voyez plus, ça vaut le coup d'œil, non ?"},
 {c:"Besoin / statu quo", q:"Tout va bien chez moi.", a:"Excellent point de départ — les meilleurs établissements optimisent quand ça va, pas quand ça brûle. On regarde ce qui pourrait aller encore mieux ?"},
 {c:"Besoin / statu quo", q:"Mon restaurant tourne, pourquoi changer ?", a:"Tourner et être rentable au maximum, c'est différent. Beaucoup de restos pleins gagnent peu. On vérifie où passe votre marge ?"},
 {c:"Besoin / statu quo", q:"Ce n'est pas une priorité.", a:"Qu'est-ce qui l'est ? Souvent la priorité — plus de chiffre, moins de stress — passe justement par ce qu'on va travailler."},
 {c:"Besoin / statu quo", q:"On verra si les affaires baissent.", a:"Attendre que ça baisse pour agir, c'est réparer sous la pluie. Optimiser quand ça va, c'est se constituer une avance."},
 {c:"Besoin / statu quo", q:"Mes clients sont fidèles, pas besoin.", a:"La fidélité est un actif énorme — et sous-exploité la plupart du temps. On peut la transformer en panier moyen et en fréquence supérieurs."},
 {c:"Besoin / statu quo", q:"Je suis complet tous les soirs.", a:"Plein ne veut pas dire rentable. Un restaurant complet avec une carte mal calibrée peut gagner moins qu'une salle à moitié pleine bien pensée."},
 {c:"Concurrence / comparaison", q:"J'ai déjà quelqu'un qui s'en occupe.", a:"Qui fait quoi, exactement ? Souvent il y a le comptable, l'agence réseaux… mais personne sur la carte, les marges et le positionnement en même temps."},
 {c:"Concurrence / comparaison", q:"Une agence me propose la même chose.", a:"Une agence fait du marketing. Moi je pars de l'assiette : carte, coûts, expérience — puis la visibilité. Le marketing sur une offre bancale, c'est de l'argent jeté."},
 {c:"Concurrence / comparaison", q:"Je vais comparer plusieurs prestataires.", a:"Sain. Comparez sur un critère simple : qui connaît vraiment la cuisine ET les chiffres ? Demandez-leur un exemple concret d'optimisation de carte."},
 {c:"Concurrence / comparaison", q:"Pourquoi vous plutôt qu'un autre ?", a:"Parce que je viens du terrain : je parle food cost, mise en place et salle, pas seulement slides et hashtags. Et je livre de l'exécution, pas des recommandations."},
 {c:"Concurrence / comparaison", q:"Mon neveu me fait déjà l'Instagram.", a:"Super pour la présence. La visibilité amplifie l'offre : si la carte et l'expérience sont optimisées d'abord, chaque post rapporte davantage."},
 {c:"Décideur / « j'en parle à… »", q:"Je dois en parler à mon associé.", a:"Bien sûr. Pour qu'il ait tous les éléments, et si on faisait l'audit à deux ? Il verra le diagnostic de ses propres yeux."},
 {c:"Décideur / « j'en parle à… »", q:"C'est ma femme / mon mari qui décide.", a:"Parfait, associons-la ou associons-le. Je peux présenter le diagnostic aux deux pour que la décision se prenne sur du concret."},
 {c:"Décideur / « j'en parle à… »", q:"Je dois voir avec mon comptable.", a:"Très bien — précisez-lui que c'est une prestation déductible, sans charges patronales. Il verra vite l'intérêt fiscal, en plus du retour."},
 {c:"Décideur / « j'en parle à… »", q:"Ce n'est pas moi qui gère ça.", a:"Qui est la bonne personne ? Je préfère parler directement à celui qui porte les chiffres, pour ne pas vous transformer en intermédiaire."},
 {c:"Décideur / « j'en parle à… »", q:"Je dois consulter la banque.", a:"Compréhensible pour un investissement. Un dossier avec le diagnostic chiffré de l'audit parlera bien mieux à votre banquier qu'une simple intention."},
 {c:"Résultats / ROI", q:"Vous me garantissez des résultats ?", a:"Je garantis la méthode et l'exécution ; le résultat dépend aussi de la mise en œuvre. C'est pour ça qu'au niveau haut, je prends la mise en œuvre en charge."},
 {c:"Résultats / ROI", q:"En combien de temps je vois un retour ?", a:"Certaines actions — repricing, plats signatures, upselling — se voient en quelques semaines. Le repositionnement complet, sur 2 à 3 mois."},
 {c:"Résultats / ROI", q:"Comment vous mesurez le succès ?", a:"Sur des indicateurs clairs qu'on fixe ensemble dès l'audit : marge, ticket moyen, food cost, remplissage. Du chiffre, pas du ressenti."},
 {c:"Résultats / ROI", q:"Et si ma clientèle n'aime pas les changements ?", a:"On ne casse pas ce qui marche : on garde vos best-sellers, on corrige les perdants, on teste progressivement. Le risque est piloté."},
 {c:"Résultats / ROI", q:"Et si je ne récupère jamais ma mise ?", a:"C'est précisément pourquoi on commence par mesurer le potentiel. Je n'engage pas un client dont les chiffres ne suivent pas — c'est mauvais pour ma réputation."},
 {c:"Résultats / ROI", q:"Comment être sûr que ce n'est pas du vent ?", a:"Le vent ne se mesure pas ; mes livrables si — fiches chiffrées, food cost, ticket moyen. Vous verrez la différence en euros."},
 {c:"Peur du changement", q:"J'ai peur de dénaturer mon concept.", a:"Mon travail, c'est de révéler votre identité, pas de la remplacer. On part de ce qui fait votre signature et on l'amplifie."},
 {c:"Peur du changement", q:"Je ne veux pas tout chambouler.", a:"Personne ne le veut. On procède par priorités : les quick wins d'abord, sans révolution. Vous gardez la main à chaque étape."},
 {c:"Peur du changement", q:"Mon équipe va résister.", a:"C'est fréquent. Un cadre clair et des process simples rassurent l'équipe plus qu'ils ne l'inquiètent — je vous aide à embarquer tout le monde."},
 {c:"Peur du changement", q:"J'ai mes habitudes, ça me convient.", a:"Vos habitudes vous ont mené jusqu'ici, bravo. Pour aller plus loin, il faut parfois un angle neuf — sans renier ce qui marche."},
 {c:"Timing / « pas maintenant »", q:"Rappelez-moi dans 6 mois.", a:"On peut. Mais 6 mois de marge non optimisée, c'est autant de perdu. Faisons au moins l'audit maintenant, vous déciderez de la suite ensuite."},
 {c:"Timing / « pas maintenant »", q:"Je viens d'ouvrir, c'est trop tôt.", a:"Au contraire — poser les bonnes bases dès le départ évite de corriger des habitudes coûteuses plus tard. C'est le meilleur moment."},
 {c:"Timing / « pas maintenant »", q:"J'attends de voir comment se passe l'année.", a:"Attendre, c'est décider de ne rien changer. L'audit ne coûte que 290 € et vous donne une longueur d'avance sur cette année-là."},
 {c:"Timing / « pas maintenant »", q:"C'est la période creuse, pas de budget.", a:"La période creuse, c'est le meilleur moment pour préparer : on met tout en place tranquillement pour exploser au prochain pic."},
 {c:"Timing / « pas maintenant »", q:"Je suis en travaux / en transition.", a:"Parfait timing en réalité : autant intégrer la stratégie carte et prix pendant que tout bouge, plutôt que de refaire deux fois."},
 {c:"Contrat / engagement", q:"Je ne veux pas m'engager sur la durée.", a:"L'audit n'engage à rien. Ensuite, chaque forfait a un périmètre et une durée définis à l'avance — vous savez exactement où vous mettez les pieds."},
 {c:"Contrat / engagement", q:"Il y a un contrat à signer ?", a:"Oui, un contrat clair qui protège les deux parties : périmètre, livrables, prix convenu. Rien de caché."},
 {c:"Contrat / engagement", q:"Et si je veux arrêter en cours ?", a:"On cadre les modalités dès le départ. Mais honnêtement, la question ne se pose plus quand les résultats arrivent."},
 {c:"Contrat / engagement", q:"Je veux un devis détaillé d'abord.", a:"Bien sûr, je vous l'établis. Il sera d'autant plus précis après l'audit, une fois le périmètre réel connu."},
 {c:"Esquives / fin de non-recevoir", q:"Envoyez-moi une plaquette / un mail.", a:"Je peux, mais une plaquette ne dira rien de VOTRE établissement. 90 minutes sur place vous apprendront dix fois plus. On cale ça ?"},
 {c:"Esquives / fin de non-recevoir", q:"Laissez-moi votre carte.", a:"Avec plaisir. Et pour que ce ne soit pas une carte de plus dans un tiroir, bloquons dès maintenant l'audit — c'est là que vous verrez la valeur."},
 {c:"Esquives / fin de non-recevoir", q:"On n'est pas intéressés.", a:"Aucun souci. Par curiosité : c'est le principe du conseil qui ne vous parle pas, ou le moment ? Votre réponse m'aide à ne pas vous déranger pour rien."},
 {c:"Esquives / fin de non-recevoir", q:"Ça ne marche pas pour un établissement comme le mien.", a:"C'est ce que pensent beaucoup avant l'audit. Dites-m'en plus sur le vôtre — souvent, plus le cas est spécifique, plus il y a de leviers cachés."},
 {c:"Esquives / fin de non-recevoir", q:"Je déteste qu'on me démarche.", a:"Je comprends, et je ne suis pas là pour vous forcer la main. Je propose un diagnostic, vous gardez 100 % de la décision. Ça vous va comme cadre ?"},

 {c:"Esquives / fin de non-recevoir", q:"Pas intéressé par le conseil en général.", a:"Beaucoup le disent avant de voir des chiffres concrets sur leur propre maison. Si l'audit ne vous apporte rien, vous ne me devez qu'un café."},

 {c:"Relance / après RDV", q:"J'ai choisi quelqu'un d'autre.", a:"Très bien, je respecte. Si jamais l'exécution ne suit pas, ma porte reste ouverte — je reste dispo pour un second regard."}

let roiState=loadRoi();
function loadRoi(){try{const r=localStorage.getItem('pyros_roi_v1');if(r)return JSON.parse(r)||{};}catch(e){}return {net:2500,mois:2,presta:5000,is:15};}
function saveRoi(){try{localStorage.setItem('pyros_roi_v1',JSON.stringify(roiState));}catch(e){}}
function computeRoi(r){
  const net=fnum(r.net),mois=fnum(r.mois),presta=fnum(r.presta),is=(r.is!=null?fnum(r.is):15)/100;
  const brut=net*1.28, coutEmp=brut*1.375, coutEmpN=coutEmp*mois;
  const tva=presta*0.20, coutReel=presta*(1-is), diff=coutEmpN-coutReel, ratio=coutReel>0?coutEmpN/coutReel:0;
  return {ok:presta>0&&net>0&&mois>0,net,mois,presta,is,brut,coutEmp,coutEmpN,tva,coutReel,diff,ratio};
}
function roiText(c){
  return `${c.mois} mois d'un chef à ${Math.round(c.net)} € net = environ ${eur(c.coutEmpN)} de coût réel employeur (salaire chargé, congés payés, mutuelle, CDI difficile à rompre).\nMa prestation : ${eur(c.presta)} HT, soit environ ${eur(c.coutReel)} de coût réel après déduction (TVA récupérable, charge déductible à l'IS).\nRésultat : ~${eur(c.coutReel)} au lieu de ~${eur(c.coutEmpN)}, pour une compétence que vous n'avez pas en interne — sans charges, sans engagement, sans rupture.`;
}

    <div id="scriptlist"></div>`;
  wireObjModes();
  app.querySelectorAll('[data-roi]').forEach(i=>{i.oninput=()=>{const v=i.value.trim().replace(',','.');roiState[i.dataset.roi]=(v===''?undefined:(parseFloat(v)||0));saveRoi();renderRoiRes();};});
  document.getElementById('scriptlist').innerHTML=SCRIPTS.map((s,i)=>`<div class="scriptcard"><div class="sh"><h4>${esc(s.t)}</h4><button class="copybtn" data-scr="${i}">Copier</button></div><div class="sb">${esc(s.b)}</div></div>`).join('');
  app.querySelectorAll('[data-scr]').forEach(b=>b.onclick=()=>copyText(SCRIPTS[+b.dataset.scr].b,'Script copié'));
  renderRoiRes();
}
function renderRoiRes(){
  const el=document.getElementById('roires'); if(!el)return;
  const c=computeRoi(roiState);
  if(!c.ok){el.innerHTML=`<div class="roidisc">Renseigne le salaire, la durée et le montant de ta prestation pour voir le calcul.</div>`;return;}
  const row=(l,v)=>`<div class="roirow"><span class="l">${l}</span><span class="v">${v}</span></div>`;
  el.innerHTML=`<div class="roires2">
    ${row('Salaire brut estimé',eur(c.brut)+' /mois')}
    ${row('Coût réel employeur',eur(c.coutEmp)+' /mois')}
    ${row(`Sur ${c.mois} mois`,eur(c.coutEmpN))}
    ${row('Ta prestation',eur(c.presta)+' HT')}
    ${row('TVA récupérable',eur(c.tva))}
    ${row(`Coût réel après déduction IS (${Math.round(c.is*100)} %)`,eur(c.coutReel))}
  </div>
  <div class="roiverdict">${c.mois} mois d\u2019un chef ≈ <b>${eur(c.coutEmpN)}</b>. Ta prestation ≈ <b>${eur(c.coutReel)}</b> net réel — pour une compétence absente en interne, sans charges, sans engagement, sans rupture.</div>
  <div class="btnrow"><button class="btn" id="roi-copy">Copier l\u2019argument</button></div>
  <div class="roidisc">Ordre de grandeur : net→brut ×1,28 ; brut→coût employeur ×1,375 ; TVA neutre pour un assujetti ; déduction à l\u2019IS. Fais valider les chiffres exacts par un comptable avant de les écrire sur un document client.</div>`;
  document.getElementById('roi-copy').onclick=()=>copyText(roiText(c),'Argument copié');
}

function renderObjBrowse(){
  const cm=objCats(), total=objAll().length;
  let chips=`<button class="chip ${objFilter==='*'?'on':''}" data-cat="*">Toutes<span class="n">${total}</span></button>`;
  Object.keys(cm).forEach(c=>{chips+=`<button class="chip ${objFilter===c?'on':''}" data-cat="${esc(c)}">${esc(c)}<span class="n">${cm[c]}</span></button>`;});
  const list=objFiltered();
  let items=list.map(o=>`<div class="obj ${objShowA?'':'hideA'} ${o.mine?'mine':''}">
      ${o.mine?`<button class="odel" data-del="${esc(o.q)}" title="Supprimer">×</button>`:''}
      <div class="ocat">${esc(o.c)}</div>
      <div class="oq"><span class="tag">Client</span><span class="txt">${esc(o.q)}</span></div>
      <div class="oa"><span class="tag">Réponse</span><span class="txt">${esc(o.a)}</span></div>
    </div>`).join('');
  if(!list.length) items=`<div class="empty">Aucune réplique ne correspond.<br>Change de filtre ou ajoute la tienne.</div>`;
  app.innerHTML=objModesHTML()+`
    <div class="otools">
      <input class="search" id="oq" placeholder="Rechercher une objection…" value="${esc(objQuery)}">
      <button class="btn ghost" id="toggleA">${objShowA?'Masquer réponses':'Voir réponses'}</button>
      <button class="btn" id="oadd">＋ Ajouter</button>
    </div>
    <div class="chips">${chips}</div>
    <div class="ocount">${list.length} réplique${list.length>1?'s':''}</div>${items}`;
  wireObjModes();
  const qi=document.getElementById('oq');
  qi.oninput=()=>{objQuery=qi.value;const p=qi.selectionStart;renderObjBrowse();const n=document.getElementById('oq');n.focus();n.setSelectionRange(p,p);};
  document.getElementById('toggleA').onclick=()=>{objShowA=!objShowA;renderObjBrowse();};
  document.getElementById('oadd').onclick=openAdd;
  app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{objFilter=b.dataset.cat;renderObjBrowse();});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{userAdds=userAdds.filter(o=>o.q!==b.dataset.del);objSave();renderObjBrowse();toast('Réplique supprimée');});
}

function buildDeck(){
  objPool=objFiltered().length?objFiltered():objAll();
  objDeck=objPool.map((_,i)=>i);
  for(let i=objDeck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[objDeck[i],objDeck[j]]=[objDeck[j],objDeck[i]];}
  objDi=0;objRevealed=false;
}
function renderObjTrain(){
  if(!objPool.length)buildDeck();
  if(!objPool.length){app.innerHTML=objModesHTML()+`<div class="empty">Aucune réplique à réviser.</div>`;wireObjModes();return;}
  if(objDi>=objDeck.length){
    app.innerHTML=objModesHTML()+`<div class="stage"><div class="flash"><div class="fcat">Terminé</div>
      <div class="client">Deck bouclé 💪</div><div class="clienttag">${objDeck.length} objection${objDeck.length>1?'s':''} passée${objDeck.length>1?'s':''}</div>
      <div class="reveal"><button class="btn" id="oagain" style="width:100%;padding:14px">Recommencer</button></div></div></div>`;
    wireObjModes();document.getElementById('oagain').onclick=()=>{buildDeck();renderObjTrain();};return;
  }
  const o=objPool[objDeck[objDi]];
  app.innerHTML=objModesHTML()+`<div class="stage">
    <div class="flash">
      <div class="fcat">${esc(o.c)}</div>
      <div class="clienttag">Le client vous dit</div>
      <div class="client">« ${esc(o.q)} »</div>
      <div class="reveal">
        ${objRevealed?`<div class="answerbox"><div class="l">Ta réponse</div><div class="t">${esc(o.a)}</div></div>`:''}
        <div class="tctrl">
          ${objRevealed?`<button class="btn ghost" id="olater">Revoir plus tard</button><button class="btn" id="onext">Suivant →</button>`
                       :`<button class="btn" id="oshow" style="flex:1">Voir la réponse</button>`}
        </div>
      </div>
    </div>
    <div class="tmeta"><span>${objDi+1} / ${objDeck.length}</span><button class="rs" id="oreshuffle">Mélanger</button></div>
  </div>`;
  wireObjModes();
  if(objRevealed){
    document.getElementById('onext').onclick=()=>{objDi++;objRevealed=false;renderObjTrain();};
    document.getElementById('olater').onclick=()=>{objDeck.push(objDeck[objDi]);objDi++;objRevealed=false;renderObjTrain();};
  } else {
    document.getElementById('oshow').onclick=()=>{objRevealed=true;renderObjTrain();};
  }
  document.getElementById('oreshuffle').onclick=()=>{buildDeck();renderObjTrain();};
}

const ov=document.getElementById('ov');
function openAdd(){
  const sel=document.getElementById('f-cat');
  sel.innerHTML=Object.keys(objCats()).map(c=>`<option>${esc(c)}</option>`).join('');
  document.getElementById('f-q').value='';document.getElementById('f-a').value='';
  ov.classList.add('on');
}
document.getElementById('f-cancel').onclick=()=>ov.classList.remove('on');
ov.onclick=e=>{if(e.target===ov)ov.classList.remove('on');};
document.getElementById('f-save').onclick=()=>{
  const c=document.getElementById('f-cat').value, q=document.getElementById('f-q').value.trim(), a=document.getElementById('f-a').value.trim();
  if(!q||!a){toast('Remplis l\u2019objection et la réponse');return;}
  userAdds.push({c,q,a});objSave();ov.classList.remove('on');
  objMode==='train'?(buildDeck(),renderObjTrain()):renderObjBrowse();
  toast('Réplique ajoutée');
};
/* =================== FIN OBJECTIONS MODULE =================== */

document.getElementById('foot').textContent=`Audit ${TOTAL} pts · Objections ${SEED.length}+ · Finances & KPI · sauvegarde locale`;
render();
</script>
