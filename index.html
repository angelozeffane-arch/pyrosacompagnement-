<script>
(function(){
  var stage=document.getElementById('deckStage');
  stage.innerHTML="<section class=\"sl cover\"><div class=\"k\">PYROS Accompagnement · Angelo</div><h1>De restaurateur à businessman.</h1><div class=\"sub\">Transformer l’offre culinaire en moteur de rentabilité et de croissance.</div><div class=\"ret\"></div></section><section class=\"sl\"><div class=\"k\">Sommaire</div><h2>Le déroulé</h2><div class=\"toc\"><div class=\"tocrow\"><span class=\"tn\">01</span><span>Le constat</span></div><div class=\"tocrow\"><span class=\"tn\">02</span><span>La méthode</span></div><div class=\"tocrow\"><span class=\"tn\">03</span><span>Le Growth System</span></div><div class=\"tocrow\"><span class=\"tn\">04</span><span>Le plan d’action</span></div><div class=\"tocrow\"><span class=\"tn\">05</span><span>L’offre</span></div></div></section><section class=\"sl divider\"><div class=\"ghost\">01</div><div class=\"k\">Partie 01</div><h2>Le constat</h2></section><section class=\"sl statement\"><div class=\"k\">La promesse</div><p class=\"big\">Transformer l’offre culinaire en moteur de rentabilité et de croissance.</p></section><section class=\"sl\"><div class=\"k\">01 · Le constat</div><h2>Le problème</h2><div class=\"cols c2\"><div class=\"cc\"><div class=\"ct\">Une carte trop longue</div><div class=\"cd\">Trop de références, trop de stock, trop de pertes. La cuisine subit la carte au lieu de la piloter.</div></div><div class=\"cc\"><div class=\"ct\">Une identité floue</div><div class=\"cd\">Rien ne distingue l’établissement de ses voisins. Le client choisit par le prix ou la proximité.</div></div><div class=\"cc\"><div class=\"ct\">Une marge faible</div><div class=\"cd\">Les coûts matière ne sont pas suivis plat par plat. Les prix ont été fixés une fois, puis oubliés.</div></div><div class=\"cc\"><div class=\"ct\">Une dépendance au patron</div><div class=\"cd\">Tout repose sur une personne. L’établissement ne tourne pas sans elle, et ne se vend pas non plus.</div></div></div></section><section class=\"sl divider\"><div class=\"ghost\">02</div><div class=\"k\">Partie 02</div><h2>La méthode</h2></section><section class=\"sl\"><div class=\"k\">02 · La méthode</div><h2>L’audit</h2><p class=\"body\">15 points analysés sur place, en 90 minutes à 2 heures. Point d’entrée obligatoire de tout accompagnement. <b>Livrable : les 15 actions prioritaires</b> pour améliorer l’offre, la marge et l’attractivité de l’établissement.</p></section><section class=\"sl\"><div class=\"k\">02 · La méthode</div><h2>Le menu engineering</h2><div class=\"quad\"><div class=\"qc g\"><div class=\"qt\">Stars</div><div class=\"qd\">Populaires et rentables. À protéger, mettre en avant, décliner en signature.</div></div><div class=\"qc o\"><div class=\"qt\">Plow Horses</div><div class=\"qd\">Populaires mais peu rentables. À retravailler : grammage, fournisseur, prix, accompagnement.</div></div><div class=\"qc b\"><div class=\"qt\">Puzzles</div><div class=\"qd\">Rentables mais peu vendus. À remonter dans la carte, renommer, faire recommander en salle.</div></div><div class=\"qc r\"><div class=\"qt\">Dogs</div><div class=\"qd\">Peu vendus et peu rentables. À retirer de la carte, sans exception sentimentale.</div></div></div></section><section class=\"sl\"><div class=\"k\">02 · La méthode</div><h2>L’analyse de la carte</h2><div class=\"cols c3\"><div class=\"cc\"><div class=\"ct\">Nombre de plats</div><div class=\"cd\">Le volume de références que la cuisine doit tenir chaque service.</div></div><div class=\"cc\"><div class=\"ct\">Répétitions</div><div class=\"cd\">Ingrédients et techniques qui reviennent d’un plat à l’autre.</div></div><div class=\"cc\"><div class=\"ct\">Lisibilité</div><div class=\"cd\">Ce que le client comprend en trente secondes de lecture.</div></div><div class=\"cc\"><div class=\"ct\">Cohérence</div><div class=\"cd\">L’écart entre la carte annoncée et l’identité réelle du lieu.</div></div><div class=\"cc\"><div class=\"ct\">Prix</div><div class=\"cd\">La logique de l’échelle de prix, plage par plage.</div></div><div class=\"cc\"><div class=\"ct\">Saisonnalité</div><div class=\"cd\">La capacité de la carte à bouger sans être refaite.</div></div></div></section><section class=\"sl\"><div class=\"k\">02 · La méthode</div><h2>Rentabilité et concurrence</h2><div class=\"cols c2\"><div class=\"cc\"><div class=\"ct\">La rentabilité, plat par plat</div><div class=\"cd\">Food cost, marge brute et volume croisés pour arbitrer chaque plat.</div></div><div class=\"cc\"><div class=\"ct\">La concurrence, cinq établissements</div><div class=\"cd\">Voisins directs : prix, angles, offres du moment, positionnement relatif.</div></div></div></section><section class=\"sl divider\"><div class=\"ghost\">03</div><div class=\"k\">Partie 03</div><h2>Le Growth System</h2></section><section class=\"sl statement\"><div class=\"k\">Les cinq phases</div><p class=\"big\">L’ordre compte : on ne lance pas d’acquisition sur une carte non réglée, et on ne fidélise pas une clientèle qu’on n’a pas encore convertie.</p></section><section class=\"sl\"><div class=\"k\">Phase 1 — Diagnostic</div><h2>Poser les chiffres</h2><div class=\"cols c3\"><div class=\"cc\"><div class=\"ct\">Business</div><div class=\"cd\">Chiffre, charges, saisonnalité, points de fuite.</div></div><div class=\"cc\"><div class=\"ct\">Carte</div><div class=\"cd\">Structure, ventes, marges, plats à arbitrer.</div></div><div class=\"cc\"><div class=\"ct\">Clientèle</div><div class=\"cd\">Qui vient, quand, pour quoi, à quel panier.</div></div><div class=\"cc\"><div class=\"ct\">Positionnement</div><div class=\"cd\">Ce que le lieu promet et ce qu’il tient.</div></div><div class=\"cc\"><div class=\"ct\">Concurrence</div><div class=\"cd\">Cinq voisins directs, prix et angles.</div></div><div class=\"cc\"><div class=\"ct\">Visibilité</div><div class=\"cd\">Réseaux, fiche Google, avis, photos.</div></div></div></section><section class=\"sl\"><div class=\"k\">Phase 2 — Produit</div><h2>Régler l’offre</h2><div class=\"cols c3\"><div class=\"cc\"><div class=\"ct\">Architecture</div><div class=\"cd\">Nouvelle carte, moins de références, plus de sens.</div></div><div class=\"cc\"><div class=\"ct\">Échelle de prix</div><div class=\"cd\">Revue à partir des coûts réels et des marges cibles.</div></div><div class=\"cc\"><div class=\"ct\">Plats signatures</div><div class=\"cd\">Trois plats qui portent l’identité et se photographient.</div></div><div class=\"cc\"><div class=\"ct\">Desserts</div><div class=\"cd\">Le poste le plus rentable, presque toujours sous-exploité.</div></div><div class=\"cc\"><div class=\"ct\">Expérience</div><div class=\"cd\">Dressage, service, rythme des envois, cohérence de salle.</div></div><div class=\"cc\"><div class=\"ct\">Production</div><div class=\"cd\">Mise en place, grammages, fiches techniques chiffrées.</div></div></div></section><section class=\"sl\"><div class=\"k\">Phase 3 — Acquisition</div><h2>Faire venir</h2><div class=\"cols c3\"><div class=\"cc\"><div class=\"ct\">Instagram & TikTok</div><div class=\"cd\">Un format récurrent, tenable par l’équipe en interne.</div></div><div class=\"cc\"><div class=\"ct\">Google</div><div class=\"cd\">Fiche, photos, avis, mots-clés : la première vitrine.</div></div><div class=\"cc\"><div class=\"ct\">Contenu</div><div class=\"cd\">Trente jours d’avance, produits en une session.</div></div><div class=\"cc\"><div class=\"ct\">Partenariats</div><div class=\"cd\">Commerces du quartier, échanges de visibilité.</div></div><div class=\"cc\"><div class=\"ct\">Influence locale</div><div class=\"cd\">Des relais à taille humaine, à audience réelle.</div></div><div class=\"cc\"><div class=\"ct\">Événements</div><div class=\"cd\">Une raison de venir un mardi.</div></div></div></section><section class=\"sl\"><div class=\"k\">Phase 4 — Conversion</div><h2>Transformer</h2><div class=\"cols c3\"><div class=\"cc\"><div class=\"ct\">Réservation</div><div class=\"cd\">Un parcours sans friction, du téléphone à la table.</div></div><div class=\"cc\"><div class=\"ct\">Panier moyen</div><div class=\"cd\">Suivi par service, par jour, par catégorie.</div></div><div class=\"cc\"><div class=\"ct\">Upselling</div><div class=\"cd\">Des propositions cadrées, formulées par la salle.</div></div><div class=\"cc\"><div class=\"ct\">Menus</div><div class=\"cd\">Des formules construites pour la marge.</div></div><div class=\"cc\"><div class=\"ct\">Offres</div><div class=\"cd\">Des occasions datées plutôt que des remises permanentes.</div></div><div class=\"cc\"><div class=\"ct\">Parcours client</div><div class=\"cd\">De la porte à l’addition : ce qui accélère, ce qui freine.</div></div></div></section><section class=\"sl\"><div class=\"k\">Phase 5 — Fidélisation</div><h2>Faire revenir</h2><div class=\"cols c3\"><div class=\"cc\"><div class=\"ct\">Base clients</div><div class=\"cd\">Constituée dès le premier mois, propriété du lieu.</div></div><div class=\"cc\"><div class=\"ct\">Email</div><div class=\"cd\">Un rendez-vous mensuel, sobre, une seule intention.</div></div><div class=\"cc\"><div class=\"ct\">SMS</div><div class=\"cd\">Réservé aux dates courtes et aux places limitées.</div></div><div class=\"cc\"><div class=\"ct\">Soirées habitués</div><div class=\"cd\">Des rendez-vous à jauge maîtrisée.</div></div><div class=\"cc\"><div class=\"ct\">Offres privées</div><div class=\"cd\">Un avantage réel plutôt qu’une remise généralisée.</div></div><div class=\"cc\"><div class=\"ct\">Avis</div><div class=\"cd\">Demandés au bon moment, dans le service.</div></div></div></section><section class=\"sl divider\"><div class=\"ghost\">04</div><div class=\"k\">Partie 04</div><h2>Le plan d’action</h2></section><section class=\"sl\"><div class=\"k\">04 · Le plan d’action</div><h2>Les leviers de croissance</h2><div class=\"cols c3\"><div class=\"cc\"><div class=\"ct\">Sunset menu</div><div class=\"cd\">Remplir le creux de 17 h à 19 h avec une offre courte.</div></div><div class=\"cc\"><div class=\"ct\">Afterwork</div><div class=\"cd\">Un rendez-vous hebdo installé dans le quartier.</div></div><div class=\"cc\"><div class=\"ct\">Soirée à thème</div><div class=\"cd\">Un événement daté, matière à contenu et à réservation.</div></div><div class=\"cc\"><div class=\"ct\">Offre de groupe</div><div class=\"cd\">Privatisations et tablées, sur devis, marge maîtrisée.</div></div><div class=\"cc\"><div class=\"ct\">Click & collect</div><div class=\"cd\">Un canal complémentaire sans coût de salle.</div></div><div class=\"cc\"><div class=\"ct\">Traiteur événementiel</div><div class=\"cd\">La cuisine vendue hors les murs, sur les jours creux.</div></div></div></section><section class=\"sl divider\"><div class=\"ghost\">05</div><div class=\"k\">Partie 05</div><h2>L’offre</h2></section><section class=\"sl\"><div class=\"k\">05 · L’offre</div><h2>Les livrables</h2><div class=\"livr\"><div class=\"lr\"><span class=\"ln\">01</span><span>Rapport d’audit — 15 actions prioritaires</span></div><div class=\"lr\"><span class=\"ln\">02</span><span>Nouvelle carte restructurée</span></div><div class=\"lr\"><span class=\"ln\">03</span><span>Matrice menu engineering</span></div><div class=\"lr\"><span class=\"ln\">04</span><span>Analyse de rentabilité, plat par plat</span></div><div class=\"lr\"><span class=\"ln\">05</span><span>Grille de prix sur coûts réels</span></div><div class=\"lr\"><span class=\"ln\">06</span><span>Fiches techniques chiffrées</span></div><div class=\"lr\"><span class=\"ln\">07</span><span>Étude concurrentielle — 5 établissements</span></div><div class=\"lr\"><span class=\"ln\">08</span><span>Plan d’acquisition (réseaux, Google)</span></div><div class=\"lr\"><span class=\"ln\">09</span><span>Calendrier de contenu — 30 jours</span></div><div class=\"lr\"><span class=\"ln\">10</span><span>Plan de conversion & panier moyen</span></div><div class=\"lr\"><span class=\"ln\">11</span><span>Système de fidélisation + base clients</span></div><div class=\"lr\"><span class=\"ln\">12</span><span>Feuille de route 12 mois priorisée</span></div></div></section><section class=\"sl\"><div class=\"k\">05 · L’offre</div><h2>Les trois forfaits</h2><div class=\"forf\"><div class=\"fr fh\"><div>Niveau</div><div>Prix</div><div>Positionnement</div><div>Durée</div></div><div class=\"fr fa\"><div class=\"fn\">Audit</div><div class=\"fp\">290 € HT</div><div class=\"fpos\">15 points sur place, 15 actions prioritaires</div><div class=\"fdu\">90 min – 2 h</div></div><div class=\"fr \"><div class=\"fn\">Niveau 1</div><div class=\"fp\">5 000 €</div><div class=\"fpos\">Ils font eux-mêmes — refonte de carte</div><div class=\"fdu\">≈ 2 mois</div></div><div class=\"fr \"><div class=\"fn\">Niveau 2</div><div class=\"fp\">7 500 €</div><div class=\"fpos\">On implémente ensemble — Menu & Profit System</div><div class=\"fdu\">≈ 6 mois</div></div><div class=\"fr hi\"><div class=\"fn\">Niveau 3</div><div class=\"fp\">10 000 €</div><div class=\"fpos\">Je prends la croissance en charge</div><div class=\"fdu\">≈ 12 mois</div></div></div><div class=\"fnote\">L’audit à 290 € HT est le point d’entrée obligatoire et se déduit de l’engagement retenu.</div></section><section class=\"sl\"><div class=\"k\">05 · L’offre</div><h2>Le vrai coût</h2><p class=\"body\"><b>10 000 €</b> pour douze mois, facturé en prestation : charge <b>déductible</b>, aucune charge patronale, aucun engagement de contrat de travail. Le même montant représente environ <b>deux mois de salaire chargé</b> d’un poste qu’il faudrait recruter, former et encadrer.</p></section><section class=\"sl closing\"><div class=\"k\">Réservons votre audit</div><h1>Réservons votre audit.</h1><div class=\"sub\">15 points, deux heures sur place — et les 15 actions prioritaires de votre établissement.</div><div class=\"cta\">290 € HT · 15 points · 2 h sur place</div></section>";
  var slides=stage.querySelectorAll('.sl');
  var dots=document.getElementById('deckDots');
  dots.innerHTML=Array.prototype.map.call(slides,function(){return '<i></i>'}).join('');
  var di=dots.querySelectorAll('i');
  var cur=0;
  window.deckShow=function(i){cur=Math.max(0,Math.min(slides.length-1,i));
    slides.forEach(function(s,k){s.classList.toggle('show',k===cur)});
    di.forEach(function(d,k){d.classList.toggle('on',k===cur)});
    document.getElementById('deckCount').textContent=(cur+1)+' / '+slides.length;};
  window.deckGo=function(d){deckShow(cur+d)};
  window.openDeck=function(){document.getElementById('deck').classList.add('open');deckShow(0);document.body.style.overflow='hidden'};
  window.closeDeck=function(){document.getElementById('deck').classList.remove('open');document.body.style.overflow=''};
  document.addEventListener('keydown',function(e){if(!document.getElementById('deck').classList.contains('open'))return;
    if(e.key==='ArrowRight'||e.key===' ')deckGo(1);else if(e.key==='ArrowLeft')deckGo(-1);else if(e.key==='Escape')closeDeck();});
  var x0=null;stage.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  stage.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>45)deckGo(dx<0?1:-1);x0=null},{passive:true});
  var pb=document.getElementById('s-pitch');if(pb)pb.onclick=function(e){e.preventDefault();openDeck()};
})();

<script>
(function(){
  var loaded=false;
  window.openScript=function(){
    var ov=document.getElementById('scriptov');
    if(!loaded){
      var b=document.getElementById('scriptB64').textContent.trim();
      var f=document.createElement('iframe');
      f.setAttribute('title','PYROS — Script');
      try{f.srcdoc=new TextDecoder('utf-8').decode(Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)}));}catch(e){f.src='data:text/html;base64,'+b;}

    }
